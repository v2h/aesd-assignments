name: assignment-test
on:
    push:
        tags-ignore:
            - '*'
        branches:
            - '*'
jobs:
    unit-test:
        container: cuaesd/aesd-autotest:24-unit-test
        runs-on: self-hosted
        steps:
          - uses: actions/checkout@v2
          - name: Checkout submodules
            run : git submodule update --init --recursive
          - name: Run unit test
            run: ./unit-test.sh
    full-test:
        container:
            image: cuaesd/aesd-autotest:24-assignment5
            # Cap the file-descriptor limit. The self-hosted runner's Docker
            # daemon defaults RLIMIT_NOFILE to ~1e9, which trips a valgrind bug
            # (vgPlain_safe_fd assertion / SIGSEGV) before the test even runs.
            options: --ulimit nofile=1024:524288
        runs-on: self-hosted
        steps:
          - uses: actions/checkout@v2
          - name: Checkout submodules
            run : git submodule update --init --recursive
          - name: Run full test
            run: ./full-test.sh
